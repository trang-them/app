<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học 6 - Giơ Ngón Tay Chọn (Siêu Nâng Cấp)</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(to bottom, #e0f7fa, #80deea); margin: 0; padding: 20px 0; color: #333; display: flex; justify-content: center; min-height: 100vh; }
        #game-container { width: 95%; max-width: 1100px; background: white; border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.25); margin: 0 auto; }
        h1 { color: #0277bd; text-align: center; font-size: 42px; margin-bottom: 30px; }
        #upload-section { background: #f0f8ff; padding: 30px; border-radius: 20px; margin: 20px 0; border: 4px dashed #0277bd; text-align: center; }
        button { padding: 15px 35px; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; margin: 10px; font-weight: bold; }
        #upload-btn { background: #ff9800; color: white; }
        #start-btn { background: #0277bd; color: white; font-size: 22px; padding: 18px 60px; }
        #parse-btn { background: #4caf50; color: white; }
        #extracted-text { margin-top: 20px; display: none; }
        textarea { width: 100%; height: 180px; font-size: 15px; }
        #score { font-size: 26px; font-weight: bold; color: #ff9800; text-align: center; margin: 15px 0; }
        #webcam-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        #webcam, #output-canvas { width: 260px; height: 200px; border: 8px solid #0277bd; border-radius: 20px; }
        #finger-status { font-size: 22px; font-weight: bold; color: #d81b60; text-align: center; margin: 15px 0; }
        #question { font-size: 28px; font-weight: 600; color: #01579b; text-align: center; margin: 30px 0; }
        #answers-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 900px; margin: 0 auto; }
        .option { background: white; border: 8px solid #0277bd; border-radius: 20px; padding: 25px; font-size: 22px; font-weight: bold; min-height: 130px; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.3s; }
        .option:hover { transform: scale(1.05); }
        .correct { background: #c8e6c9 !important; border-color: #4caf50 !important; }
        .wrong { background: #ffcdd2 !important; border-color: #f44336 !important; }
        #next-btn { background: #4caf50; color: white; padding: 18px 50px; font-size: 22px; border-radius: 50px; margin: 30px auto; display: none; }
        #final { display: none; font-size: 34px; color: #4caf50; text-align: center; margin-top: 40px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Học 6 - Giơ Ngón Tay Chọn (Siêu Nâng Cấp)</h1>
        <div id="upload-section">
            <div style="background:#e3f2fd;border-radius:15px;padding:25px;margin:15px auto;max-width:700px;">
                <h2>📤 Tải file Word/PDF/TXT để tự động lấy câu hỏi</h2>
                <p><strong>Hướng dẫn:</strong><br>• .txt: Tự động parse (khuyến khích)<br>• .pdf: Trích xuất text<br>• File Word: Save As → TXT rồi tải lên</p>
                <input type="file" id="file-upload" accept=".txt,.pdf" style="margin:15px 0;">
                <button id="upload-btn">🚀 Tải lên và phân tích</button>
            </div>
            <div id="extracted-text">
                <h3>Text đã trích xuất:</h3>
                <textarea id="extract-textarea"></textarea>
                <button id="parse-btn">🔄 Phân tích tự động</button>
            </div>
        </div>
        <button id="start-btn">🚀 BẮT ĐẦU CHƠI</button>
        <div id="play-section" style="display:none;">
            <div id="score">Điểm: 0 / <span id="total-q">0</span></div>
            <div id="webcam-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output-canvas" width="260" height="200"></canvas>
            </div>
            <div id="finger-status">Số ngón tay: <strong id="finger-count">0</strong><br><small>1=A  2=B  3=C  4=D</small></div>
            <div id="question"></div>
            <div id="answers-container">
                <div class="option" id="opt0"></div>
                <div class="option" id="opt1"></div>
                <div class="option" id="opt2"></div>
                <div class="option" id="opt3"></div>
            </div>
            <button id="next-btn">➡️ CÂU TIẾP THEO</button>
            <div id="final"></div>
        </div>
    </div>

    <script>
        let questions = []; let currentQuestion = 0; let score = 0; let answered = false; let lastFingerCount = 0;
        const fileInput = document.getElementById('file-upload');
        const uploadBtn = document.getElementById('upload-btn');
        const parseBtn = document.getElementById('parse-btn');
        const extractArea = document.getElementById('extract-textarea');
        const extractedDiv = document.getElementById('extracted-text');
        const startBtn = document.getElementById('start-btn');
        const playSection = document.getElementById('play-section');
        const uploadSection = document.getElementById('upload-section');
        const questionEl = document.getElementById('question');
        const options = [document.getElementById('opt0'),document.getElementById('opt1'),document.getElementById('opt2'),document.getElementById('opt3')];
        const scoreEl = document.getElementById('score');
        const totalQEl = document.getElementById('total-q');
        const nextBtn = document.getElementById('next-btn');
        const finalEl = document.getElementById('final');
        const fingerCountEl = document.getElementById('finger-count');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Chọn file trước!");
            if (file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = e => { extractArea.value = e.target.result; extractedDiv.style.display = 'block'; autoParseTXT(e.target.result); };
                reader.readAsText(file);
            } else if (file.name.endsWith('.pdf')) {
                const reader = new FileReader();
                reader.onload = async e => {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise;
                    let text = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join('\n') + '\n\n';
                    }
                    extractArea.value = text; extractedDiv.style.display = 'block';
                    alert("✅ Đã trích xuất PDF! Nhấn nút Phân tích tự động");
                };
                reader.readAsArrayBuffer(file);
            }
        };

        parseBtn.onclick = () => autoParseTXT(extractArea.value);

        function autoParseTXT(text) {
            const lines = text.trim().split('\n');
            questions = [];
            let i = 0;
            while (i < lines.length) {
                let q = lines[i++].trim(); if (!q) continue;
                let opts = [];
                for (let j = 0; j < 4; j++) if (i < lines.length) opts.push(lines[i++].trim());
                let correct = -1;
                if (i < lines.length) {
                    const line = lines[i++].trim().toLowerCase();
                    const match = line.match(/[abcd]/i);
                    if (match) correct = 'abcd'.indexOf(match[0].toLowerCase());
                }
                if (q && opts.length === 4 && correct >= 0) questions.push({q, options: opts, correct});
            }
            alert(`✅ Đã lấy ${questions.length} câu hỏi!`);
            startBtn.scrollIntoView({behavior:"smooth"});
        }

        startBtn.onclick = () => {
            if (questions.length === 0) return alert("Hãy tải file câu hỏi lên trước!");
            uploadSection.style.display = 'none';
            startBtn.style.display = 'none';
            playSection.style.display = 'block';
            startGame();
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCorrectSound() { for(let i=0;i<8;i++) setTimeout(()=>{let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type='sine';o.frequency.value=600+i*80;g.gain.value=0.3;o.connect(g);g.connect(audioCtx.destination);o.start();setTimeout(()=>o.stop(),100);},i*80); }
        function playWrongSound() { let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(400,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+1);g.gain.value=0.4;o.connect(g);g.connect(audioCtx.destination);o.start();setTimeout(()=>o.stop(),800); }

        let hands, camera, canvasCtx;
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output-canvas');
        canvasCtx = canvas.getContext('2d');

        function initMediaPipe() {
            hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.5});
            hands.onResults(onResults);
            camera = new Camera(video, {onFrame: async () => await hands.send({image: video})});
            camera.start();
        }

        function getFingerCount(landmarks, handedness) {
            let count = 0;
            const tips = [8,12,16,20], pips = [6,10,14,18];
            for(let i=0;i<4;i++) if(landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
            if(handedness==="Right") {if(landmarks[4].x < landmarks[3].x) count++;}
            else {if(landmarks[4].x > landmarks[3].x) count++;}
            return count;
        }

        function onResults(results) {
            canvasCtx.save(); canvasCtx.clearRect(0,0,canvas.width,canvas.height);
            canvasCtx.drawImage(video,0,0,canvas.width,canvas.height);
            if(results.multiHandLandmarks && results.multiHandLandmarks.length>0){
                const lm = results.multiHandLandmarks[0];
                const hand = results.multiHandedness[0].label;
                drawConnectors(canvasCtx,lm,Hands.HAND_CONNECTIONS,{color:'#00ff00',lineWidth:5});
                drawLandmarks(canvasCtx,lm,{color:'#ff0000',lineWidth:3});
                const count = getFingerCount(lm, hand);
                fingerCountEl.textContent = count;
                if(count>=1&&count<=4&&count!==lastFingerCount&&!answered){
                    handleAnswer(count-1);
                    lastFingerCount = count;
                }
            } else {
                fingerCountEl.textContent = "0"; lastFingerCount = 0;
            }
            canvasCtx.restore();
        }

        function handleAnswer(idx) {
            if(answered) return; answered=true;
            const q = questions[currentQuestion];
            const isCorrect = idx === q.correct;
            options.forEach((o,i)=>{if(i===q.correct)o.classList.add('correct');if(i===idx&&!isCorrect)o.classList.add('wrong');o.style.pointerEvents='none';});
            if(isCorrect){score++;scoreEl.textContent=`Điểm: ${score} / ${questions.length}`;playCorrectSound();}
            else playWrongSound();
            nextBtn.style.display='block';
        }

        function loadQuestion() {
            answered=false; lastFingerCount=0; nextBtn.style.display='none';
            const q=questions[currentQuestion];
            questionEl.textContent = q.q;
            options.forEach((o,i)=>{o.textContent=q.options[i];o.classList.remove('correct','wrong');o.style.pointerEvents='auto';});
        }

        function startGame() {
            currentQuestion=0; score=0;
            totalQEl.textContent=questions.length;
            scoreEl.textContent=`Điểm: 0 / ${questions.length}`;
            initMediaPipe();
            loadQuestion();
        }

        nextBtn.addEventListener('click', () => {
            currentQuestion++;
            if(currentQuestion < questions.length) loadQuestion();
            else {
                document.getElementById('answers-container').style.display='none';
                nextBtn.style.display='none';
                finalEl.style.display='block';
                finalEl.innerHTML = `🎉 HOÀN THÀNH!<br>Điểm: <strong>${score}/${questions.length}</strong><br><br><button onclick="location.reload()" style="background:#0277bd;color:white;padding:18px 50px;border:none;border-radius:50px;font-size:20px;">Chơi lại</button>`;
            }
        });

        window.onload = () => console.log("Game sẵn sàng!");
    </script>
</body>
</html>
